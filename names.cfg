grey="grayscale"


[palettes_paths]

neutral="res://textures/effects/look_up_tables/3d/lut_neutral.png"
inverse="res://textures/effects/look_up_tables/3d/lut_inverse.png"
grayscale="res://textures/effects/look_up_tables/3d/lut_grayscale.png"


