; config file for converting string aliases to filepaths
; mostly for importing from trenchbroom


; enemy species aliases
[species_aliases]

; pinkerton
strikebreaker="pinkerton"
pinky="pinkerton"
pink="pinkerton"

; canary
miner="canary"
zombie="canary"

; lizard
liz="lizard"
croc="lizard"

; sleeping lizard
lizard_asleep="eepy_lizard"
liz_asleep="eepy_lizard"
croc_asleep="eepy_lizard"
lizard_sleeping="eepy_lizard"
liz_sleeping="eepy_lizard"
croc_sleeping="eepy_lizard"
lizard_napping="eepy_lizard"
liz_napping="eepy_lizard"
croc_napping="eepy_lizard"
sleeping_lizard="eepy_lizard"
sleeping_liz="eepy_lizard"
sleeping_croc="eepy_lizard"
napping_lizard="eepy_lizard"
napping_liz="eepy_lizard"
napping_croc="eepy_lizard"
sleepy_lizard="eepy_lizard"
sleepy_liz="eepy_lizard"
sleepy_croc="eepy_lizard"
eepy_liz="eepy_lizard"
eepy_croc="eepy_lizard"

; flying eyeball
eye="eyeball"

; enforcer
cop="enforcer"

; plasma bot
plasma_bot="plasma_droid"
plasma="plasma_droid"
plas="plasma_droid"

; rocketeer
rocket="rocketeer"
rock="rocketeer"
revenant="rocketeer"
rev="rocketeer"

; soldier

[species_paths]

canary="res://entities/enemies/locals/canary/canary.tscn"
lizard="res://entities/enemies/locals/lizard/lizard.tscn"
eepy_lizard="res://entities/enemies/locals/lizard/eepy_lizard.tscn"
eyeball="res://entities/enemies/locals/eyeball/eyeball.tscn"

pinkerton="res://entities/enemies/military/pinkerton/pinkerton.tscn"
enforcer="res://entities/enemies/military/enforcer/enforcer.tscn"
rocketeer="res://entities/enemies/military/rocketeer/rocketeer.tscn"
soldier="res://entities/ememies/military/soldier/soldier.tscn"

plasma_droid="res://entities/enemies/machines/plasma_droid/plasma_droid.tscn"

; sound effects
[sounds_aliases]

metal="metal_door_move"
metal_door="metal_door_move"
metal_move="metal_door_move"
metal_open="metal_door_move"
metal_door_open="metal_door_move"

[sounds_paths]

metal_door_move="res://audio/streams/effects/metal_door_move.wav"


; color palette luts
[palettes_aliases]

default="neutral"

inv="inverse"

gray="grayscale"
